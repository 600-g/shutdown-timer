name: build-and-release

# 언제 실행되나:
#  1) main 에 소스가 올라오면 (GitHub 웹 업로드 · git push · claude.ai Code 탭 어디서든)
#     → src/PhoneShell.cs 의 VERSION build 번호를 읽어 v1.0.NN 태그가 아직 없으면 빌드 후 Release 자동 생성
#     → PhoneShell.cs 가 바뀌었는데 번호가 이미 릴리스된 것이면 실패(빨간 X)로 알림 → 번호 올려서 다시
#  2) v* 태그를 직접 push 해도 예전처럼 동작 (git tag)
#  3) Actions 탭 Run workflow → 빌드만 (release 체크 시 1) 과 동일)
on:
  push:
    # dev 는 컴파일 검증 전용 — 판정 단계에서 릴리스 조건에 안 걸리므로 빌드만 하고 끝난다
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'dist-extra/**'
      - 'build.sh'
      - '.github/workflows/build.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release:
        description: '태그가 없으면 Release 까지 생성'
        type: boolean
        default: false

permissions:
  contents: write   # 태그·Release 생성, 에셋 업로드

concurrency:
  group: build-and-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 이전 커밋과 diff 하기 위해 전체 이력

      - name: 버전 읽기 (src/PhoneShell.cs 의 VERSION)
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            VER=$(sed -nE 's/.*VERSION = "([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' src/PhoneShell.cs | head -1)
            if [[ -z "$VER" ]]; then
              echo "::error::src/PhoneShell.cs 에서 VERSION = \"1.0.0\" 형식을 찾지 못했습니다"
              exit 1
            fi
            TAG="v$VER"
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then EXISTS=true; else EXISTS=false; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "exists=$EXISTS" >> "$GITHUB_OUTPUT"
          echo "태그 $TAG (이미 릴리스됨: $EXISTS)"

      - name: 릴리스 여부 판정
        id: gate
        env:
          BEFORE: ${{ github.event.before }}
          EXISTS: ${{ steps.ver.outputs.exists }}
          TAG: ${{ steps.ver.outputs.tag }}
          WANT_RELEASE: ${{ inputs.release }}
        run: |
          DO=false
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            push:refs/tags/*)        DO=true ;;
            push:refs/heads/main)    [[ "$EXISTS" == "false" ]] && DO=true ;;
            workflow_dispatch:*)     [[ "$WANT_RELEASE" == "true" && "$EXISTS" == "false" ]] && DO=true ;;
          esac
          echo "release=$DO" >> "$GITHUB_OUTPUT"
          {
            echo "## 자동 종료 타이머 빌드"
            echo "- 태그: \`$TAG\` (이미 릴리스됨: $EXISTS)"
            echo "- Release 생성: **$DO**"
          } >> "$GITHUB_STEP_SUMMARY"

          # main 에 PhoneShell.cs 가 바뀌어 올라왔는데 번호가 그대로면 → 실패로 알려준다
          if [[ "$DO" == "false" && "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" \
                && -n "$BEFORE" && "$BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            if git diff --quiet "$BEFORE" "$GITHUB_SHA" -- src/PhoneShell.cs; then
              echo "PhoneShell.cs 변경 없음 — 빌드만 하고 끝냅니다"
            else
              echo "::error::src/PhoneShell.cs 가 바뀌었지만 $TAG 는 이미 릴리스돼 있습니다. VERSION 을 올리고(예: 1.0.1) CHANGELOG.md 에 항목을 추가한 뒤 다시 올려주세요."
              echo "- ❌ **번호를 올리지 않아 릴리스하지 않음** — \`VERSION\` 을 올리고 CHANGELOG.md 에 항목을 추가하세요" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi

      - name: mono 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-devel

      - name: 빌드
        run: |
          chmod +x build.sh
          ./build.sh

      - name: 산출물 검증 (깨진 빌드가 사용자에게 나가지 않게 막는 마지막 관문)
        run: |
          python3 - <<'PYCHK'
          import re, sys, zipfile
          fails = []
          def need(cond, msg):
              if not cond: fails.append(msg)

          z = zipfile.ZipFile("AutoShutdownTimer.zip")
          names = z.namelist()
          print("zip 내용물:", names)

          # 1) 배포물에 세 파일이 다 있어야 한다 (하나라도 빠지면 사용자가 실행을 못 한다)
          for want in ("AutoShutdownTimer.exe", "보안패치.bat", "사용설명서.txt"):
              need(want in names, f"zip 에 {want} 가 없다")
          if "AutoShutdownTimer.exe" not in names:
              print("\n".join("❌ " + f for f in fails)); sys.exit(1)

          exe = z.read("AutoShutdownTimer.exe")
          need(exe[:2] == b"MZ", "exe 가 올바른 윈도우 실행파일이 아니다")
          need(len(exe) > 500_000, f"exe 가 비정상적으로 작다 ({len(exe):,} bytes)")

          # 2) 소스의 VERSION 과 exe 안에 박힌 버전이 같아야 한다
          src = open("src/PhoneShell.cs", encoding="utf-8").read()
          m = re.search(r'VERSION = "(\d+\.\d+\.\d+)"', src)
          need(m is not None, "소스에서 VERSION 을 찾지 못했다")
          if m:
              need(("v" + m.group(1)).encode("utf-16-le") in exe, f"exe 안에 v{m.group(1)} 문자열이 없다")
              print("버전:", m.group(1))
              # CHANGELOG 에 이 버전 항목이 있어야 한다 — 없으면 사용자가 '뭐가 바뀌었나' 를 못 본다
              ch = open("CHANGELOG.md", encoding="utf-8").read()
              need(re.search(r"^##\s*" + re.escape(m.group(1)) + r"\s*$", ch, re.M) is not None,
                   f"CHANGELOG.md 에 '## {m.group(1)}' 항목이 없다")

          # 3) 자동 업데이트가 살아 있어야 한다 — 이게 빠지면 이후 사용자가 영영 갱신을 못 받는다
          for probe, why in [
              ("api.github.com/repos/600-g/shutdown-timer/releases/latest", "업데이트 확인 주소"),
              ("releases/latest/download/AutoShutdownTimer.zip", "업데이트 내려받기 주소"),
          ]:
              need(probe.encode("utf-16-le") in exe, f"{why}가 exe 에 없다 (자동 업데이트 유실)")

          # 4) 보안패치.bat 이 실제 exe 이름을 가리켜야 한다
          bat = z.read("보안패치.bat").decode("cp949", "ignore")
          need("AutoShutdownTimer.exe" in bat, "보안패치.bat 이 실제 exe 이름을 안 가리킨다")

          if fails:
              print("\n".join("❌ " + f for f in fails)); sys.exit(1)
          print("✅ 검증 통과 — 배포해도 되는 산출물")
          PYCHK

      - name: 산출물 아티팩트 업로드 (Release 안 만들어도 다운로드 가능)
        uses: actions/upload-artifact@v4
        with:
          name: AutoShutdownTimer
          path: AutoShutdownTimer.zip

      - name: 변경 내역 뽑기 (CHANGELOG.md 의 해당 버전 절)
        if: steps.gate.outputs.release == 'true'
        id: notes
        run: |
          VER="${{ steps.ver.outputs.tag }}"; VER="${VER#v}"
          python3 - "$VER" > RELEASE_NOTES.md <<'PYN'
          import re, sys
          ver = sys.argv[1]
          ch = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^##\s*" + re.escape(ver) + r"\s*$(.*?)(?=^##\s|\Z)", ch, re.M | re.S)
          print((m.group(1).strip() if m else "").strip() or "변경 내역이 없습니다.")
          PYN
          cat RELEASE_NOTES.md

      - name: Release 생성 및 zip 첨부
        if: steps.gate.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: AutoShutdownTimer.zip
          body_path: RELEASE_NOTES.md
