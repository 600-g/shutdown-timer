name: build-and-release

# 언제 실행되나:
#  1) v로 시작하는 태그를 push 하면 (예: v1.0.11) → 빌드 후 Release 자동 생성/업로드
#  2) Actions 탭에서 수동 실행(Run workflow) 해도 빌드만 함
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # Release 생성/자산 업로드에 필요

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: mono 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-devel

      - name: 빌드
        run: |
          chmod +x build.sh
          ./build.sh

      - name: 산출물 아티팩트 업로드 (태그 아니어도 다운로드 가능)
        uses: actions/upload-artifact@v4
        with:
          name: 자동종료타이머
          path: AutoShutdownTimer.zip

      - name: Release 생성 및 zip 첨부 (태그 push일 때만)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AutoShutdownTimer.zip
          generate_release_notes: true
