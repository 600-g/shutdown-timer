<!-- ============================================================
  자동 종료 타이머 · 다운로드 위젯 (600g.net 삽입용)
  ▶ 아래 REPO 한 줄만 본인 저장소로 바꾸면 끝.
    이후 GitHub에 새 버전을 릴리스하면 이 위젯이 자동으로
    최신 버전/날짜를 표시하고 최신 파일을 내려줍니다.
  ▶ 사용법: 이 <div>부터 </script>까지 통째로 사이트 원하는 위치에 붙여넣기.
 ============================================================ -->
<div id="dg600-download"></div>
<script>
(function () {
  // ▼▼▼ 여기만 본인 GitHub 저장소로 변경 ▼▼▼
  var REPO = "600-g/shutdown-timer";   // 두근컴퍼니 저장소
  // ▲▲▲ 나머지는 건드릴 필요 없음 ▲▲▲

  var ASSET = "AutoShutdownTimer.zip";
  var latestPage = "https://github.com/" + REPO + "/releases/latest";
  var latestFile = "https://github.com/" + REPO + "/releases/latest/download/" + ASSET;

  var box = document.getElementById("dg600-download");
  box.innerHTML =
    '<div style="max-width:420px;margin:0 auto;padding:22px 20px;border:1px solid #e6e9ef;'
    + 'border-radius:18px;font-family:Pretendard,\'맑은 고딕\',system-ui,sans-serif;'
    + 'background:#fff;box-shadow:0 6px 24px rgba(20,30,60,.06);text-align:center">'
    + '<div style="font-size:12px;color:#8a93a6;letter-spacing:.3px">ⓒ 600g</div>'
    + '<div style="font-size:20px;font-weight:700;color:#1c2028;margin:6px 0 2px">자동 종료 타이머</div>'
    + '<div id="dg600-ver" style="font-size:12.5px;color:#6b7488;margin-bottom:16px">최신 버전 확인 중…</div>'
    + '<a id="dg600-btn" href="' + latestFile + '" '
    + 'style="display:inline-block;background:#3876e0;color:#fff;text-decoration:none;'
    + 'font-weight:700;font-size:15px;padding:13px 30px;border-radius:14px">다운로드</a>'
    + '<div style="font-size:11.5px;color:#a2a8b4;margin-top:12px">'
    + '압축을 푼 뒤 <b>보안패치.bat</b>를 먼저 실행하세요</div>'
    + '</div>';

  // GitHub API로 최신 릴리스 버전/날짜 자동 표시 (실패해도 다운로드 버튼은 동작)
  try {
    fetch("https://api.github.com/repos/" + REPO + "/releases/latest")
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d) return;
        var tag = d.tag_name || "";
        var date = d.published_at ? new Date(d.published_at).toLocaleDateString("ko-KR") : "";
        document.getElementById("dg600-ver").textContent =
          (tag ? tag + " · " : "") + (date ? date + " 업데이트" : "");
        if (d.assets) {
          for (var i = 0; i < d.assets.length; i++) {
            if (d.assets[i].name === ASSET) {
              document.getElementById("dg600-btn").href = d.assets[i].browser_download_url;
              break;
            }
          }
        }
      })
      .catch(function () {});
  } catch (e) {}
})();
</script>
<!-- ============================================================ -->
